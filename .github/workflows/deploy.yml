name: CD — Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Frontend to EC2
    runs-on: ubuntu-latest
    needs: []          # runs independently; CI is a separate workflow
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      # ── Build frontend pointing at production API ──────────
      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          REACT_APP_API_URL: http://${{ secrets.EC2_HOST }}/api
          DISABLE_ESLINT_PLUGIN: 'true'

      # ── Package build ──────────────────────────────────────
      - name: Package build
        run: tar czf /tmp/frontend-build.tar.gz -C frontend/build .

      # ── Configure SSH ──────────────────────────────────────
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      # ── Upload build to EC2 ────────────────────────────────
      - name: Upload build to EC2
        run: |
          scp -i ~/.ssh/deploy_key \
            /tmp/frontend-build.tar.gz \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/

      # ── Hot-inject into nginx container ───────────────────
      # NOTE: We NEVER run docker compose build — backend source is
      # incomplete (source drift). Only the frontend is hot-injected.
      - name: Inject into nginx and reload
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            mkdir -p /tmp/fbuild
            tar xzf /tmp/frontend-build.tar.gz -C /tmp/fbuild
            docker cp /tmp/fbuild/. bitflow-frontend:/usr/share/nginx/html/
            docker exec bitflow-frontend nginx -s reload
            rm -rf /tmp/fbuild /tmp/frontend-build.tar.gz
            echo "Frontend deployed successfully"
          EOF

      # ── Health check ──────────────────────────────────────
      - name: Health check
        run: |
          STATUS=$(curl -sf -o /dev/null -w '%{http_code}' \
            http://${{ secrets.EC2_HOST }}/health 2>/dev/null || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "✅ Frontend healthy (HTTP 200)"
          else
            echo "⚠️  Health check returned HTTP $STATUS"
            exit 1
          fi

      # ── Summary ──────────────────────────────────────────
      - name: Deployment summary
        if: success()
        run: |
          echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`$(git rev-parse --short HEAD)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Message** | $(git log -1 --pretty=%s) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Server** | ${{ secrets.EC2_HOST }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Time** | $(date -u '+%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
