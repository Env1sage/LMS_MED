name: CD — Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Frontend to EC2
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          REACT_APP_API_URL: http://${{ secrets.EC2_HOST }}/api
          DISABLE_ESLINT_PLUGIN: 'true'
          TSC_COMPILE_ON_ERROR: 'true'
          CI: 'false'

      - name: Package build
        run: tar czf /tmp/frontend-build.tar.gz -C frontend/build .

      # Use ssh-agent for reliable key handling in GitHub Actions
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 to known hosts
        run: ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Upload build to EC2
        run: |
          scp /tmp/frontend-build.tar.gz \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/

      - name: Inject into nginx and reload
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            mkdir -p /tmp/fbuild
            tar xzf /tmp/frontend-build.tar.gz -C /tmp/fbuild
            docker cp /tmp/fbuild/. bitflow-frontend:/usr/share/nginx/html/
            docker exec bitflow-frontend nginx -s reload
            rm -rf /tmp/fbuild /tmp/frontend-build.tar.gz
            echo "Frontend deployed"
          EOF

      - name: Health check
        run: |
          STATUS=$(curl -sf -o /dev/null -w '%{http_code}' \
            http://${{ secrets.EC2_HOST }}/health 2>/dev/null || echo "000")
          echo "Health check: HTTP $STATUS"
          [ "$STATUS" = "200" ] && echo "✅ Healthy" || (echo "⚠️ Unhealthy" && exit 1)

      - name: Deployment summary
        if: success()
        run: |
          echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`$(git rev-parse --short HEAD)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Message** | $(git log -1 --pretty=%s) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Server** | ${{ secrets.EC2_HOST }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Time** | $(date -u '+%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
